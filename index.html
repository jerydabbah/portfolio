<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeremias Dabbah</title>
<style>
body { font-family: Arial; margin:0; }
.masonry { columns: 3; column-gap: 12px; padding: 20px; }
.masonry-item { break-inside: avoid; margin-bottom: 12px; }
.masonry-item img { width: 100%; display:block; }
.masonry-caption { font-size: 12px; margin-top: 4px; color: #666; }
</style>
</head>
<body>

<div class="masonry" id="masonry-grid"></div>

<button id="btn-guardar">Guardar</button>
<button id="btn-limpiar">Limpiar</button>

<script>

// ---------------- DEFAULT ----------------
var DEFAULT_PROJECTS = [
  { title: "Torre Rinalda", src: "https://images.unsplash.com/photo-1487958449943-2429e8be8625?w=800&q=80" }
];

var PROYECTOS = DEFAULT_PROJECTS.slice();
var gridEl = document.getElementById('masonry-grid');

// ---------------- LOAD ----------------
async function loadProjects() {
  try {
    var res = await fetch('/.netlify/functions/get-projects', { cache: 'no-store' });
    if (!res.ok) throw new Error('Error cargando proyectos');

    var data = await res.json();

    // 🔥 FIX CLAVE (permite arrays vacíos)
    if (Array.isArray(data)) {
      PROYECTOS = data;
    } else {
      PROYECTOS = DEFAULT_PROJECTS.slice();
    }

  } catch (e) {
    console.error(e);
    PROYECTOS = DEFAULT_PROJECTS.slice();
  }

  renderPortfolio();
}

// ---------------- RENDER ----------------
function renderPortfolio() {
  gridEl.innerHTML = '';

  PROYECTOS.forEach(function(p) {
    var div = document.createElement('div');
    div.className = 'masonry-item';

    var img = document.createElement('img');
    img.src = p.src;

    var cap = document.createElement('div');
    cap.className = 'masonry-caption';
    cap.textContent = p.title;

    div.appendChild(img);
    div.appendChild(cap);

    gridEl.appendChild(div);
  });
}

// ---------------- GUARDAR ----------------
document.getElementById('btn-guardar').addEventListener('click', async function() {
  try {
    await fetch('/.netlify/functions/admin-save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(PROYECTOS)
    });

    await loadProjects();

  } catch (e) {
    console.error(e);
  }
});

// ---------------- LIMPIAR ----------------
document.getElementById('btn-limpiar').addEventListener('click', async function() {
  if (!confirm('Eliminar todos los proyectos?')) return;

  PROYECTOS = [];

  await fetch('/.netlify/functions/admin-save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(PROYECTOS)
  });

  await loadProjects();
});

// ---------------- INIT ----------------
loadProjects();

</script>

</body>
</html>
